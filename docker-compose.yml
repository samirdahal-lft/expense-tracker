services:
  backend:
    build: ./backend
    ports:
      # Host 8001 → container 8000 (host 8000 is used by the local .venv uvicorn).
      - "8001:8000"
    volumes:
      - db-data:/data
    environment:
      - EXPENSE_DB_PATH=/data/expenses.db
      # Session cookie signing key — the app fails closed if unset. Supplied from
      # the gitignored .env file (compose substitutes it); never hardcode a secret here.
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set (see .env)}

  frontend:
    build: ./frontend
    ports:
      # Host 8091 → container 80 (8090 is stuck behind an orphaned docker-proxy).
      - "8091:80"
    depends_on:
      - backend

volumes:
  db-data:
